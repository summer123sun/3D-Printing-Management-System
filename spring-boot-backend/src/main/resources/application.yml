spring:
  profiles:
    active: dev
  application:
    name: print-club-backend
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    charset: UTF-8
    # ✅ v2.13 修复（审查发现）：nozzleSize / buildVolume 等 BigDecimal 默认序列化成科学计数法（4E-1）或带 .toString() 形式
    #    WRITE_BIGDECIMAL_AS_PLAIN 让 BigDecimal 序列化为普通小数（0.4 而不是 4E-1）
    serialization:
      write-bigdecimal-as-plain: true

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

server:
  port: 8080
  servlet:
    context-path: /
    # 强制 UTF-8 编码（防中文乱码：PowerShell / 老浏览器 POST JSON 时默认 ISO-8859-1）
    encoding:
      charset: UTF-8
      force: true

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true   # 数据库下划线自动转驼峰
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印 SQL（开发用）
  global-config:
    db-config:
      id-type: ASSIGN_ID                  # 雪花算法 ID
      logic-delete-field: deleted         # 逻辑删除字段（暂未启用）
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT 配置
jwt:
  # ✅ v2.12 修复（审查发现）：之前 secret 直接写在 application.yml 里 → clone 仓库即可伪造社长 token
  #    改成占位符：dev 环境用默认值启动 OK；prod 环境必须用环境变量覆盖，否则启动 fail-fast
  #    启动校验在 JwtSecretValidator 里做（启动时检查若 secret 仍是占位符则抛错）
  secret: ${JWT_SECRET:dev-only-placeholder-change-in-prod-min-32-chars-long-xxxxx}
  # 过期时间（毫秒）— 默认 24 小时（v2.12 从 7 天缩短，被偷 token 风险窗口更小）
  expiration: ${JWT_EXPIRATION:86400000}
  # 请求头名称
  header: Authorization
  # token 前缀
  prefix: "Bearer "

# 文件上传路径
# 路径必须用绝对路径，避免 Spring Boot 工作目录漂移到 Tomcat temp 目录
# 组员拉代码后需要改成自己的项目绝对路径（或者保持相对路径 ./uploads/，但相对路径在 IDEA Run 时漂移到 .idea 目录可能有问题）
# 推荐：保持绝对路径，组员 clone 后改成自己的路径
file:
  upload-dir: ${user.dir}/uploads/
  access-prefix: /uploads/

# Knife4j 接口文档
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-version: false
    enable-swagger-models: true
    swagger-model-name: 实体类列表

# 日志
logging:
  level:
    root: INFO
    com.printclub: DEBUG
    com.baomidou.mybatisplus: WARN